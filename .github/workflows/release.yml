name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: spindle-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to point to the latest main commit
        shell: bash
        run: |
          set -euo pipefail
          tagged_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$main_sha" || "$tagged_sha" != "$main_sha" ]]; then
            echo "::error::Release tag points to $tagged_sha, but main is $main_sha. Merge changes, pull main and create a NEW version tag; do not force-move published tags."
            exit 1
          fi
      - name: Validate semantic version (stable or RC)
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node scripts/prepare-release.mjs --validate "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp release version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.mjs --prepare "$RELEASE_TAG"
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build app and icons
        run: pnpm build
      - name: Package Linux (.deb and .AppImage)
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
      - name: Package Windows (NSIS .exe)
        if: matrix.platform == 'windows'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Validate update feed metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-update-metadata.mjs "$RELEASE_PLATFORM" "$RELEASE_VERSION" release
      - name: Validate expected release packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-release-artifacts.mjs "$RELEASE_PLATFORM" "$RELEASE_VERSION" release
      # The same script runs in PR CI and on the actual tag-stamped release.
      # Any packaged smoke failure prevents artifact upload and publication.
      - name: Install and smoke-test tagged Linux DEB and AppImage releases
        if: matrix.platform == 'linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/smoke-release-linux.sh "$RELEASE_VERSION"
      - name: Install and smoke-test tagged Windows NSIS release
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SPINDLE_RELEASE_SMOKE: '1'
        run: ./scripts/smoke-release-nsis.ps1 -Version $env:RELEASE_VERSION
      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: spindle-${{ matrix.platform }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/latest.yml
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: spindle-*
          merge-multiple: true
          path: dist
      - name: Verify all three platform assets and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          node scripts/verify-release-artifacts.mjs all "$RELEASE_VERSION" dist
          node scripts/verify-update-metadata.mjs all "$RELEASE_VERSION" dist
          (cd dist && shopt -s nullglob && sha256sum -- ./*.deb ./*.AppImage ./*.exe ./*.yml ./*.blockmap > SHA256SUMS.txt)
      - name: Publish release with retries and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" "$IS_PRERELEASE" dist
