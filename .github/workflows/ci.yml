name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        if: runner.os == 'Linux'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Package Linux (.deb and AppImage)
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
      - name: Package Windows (.exe)
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Verify Linux updater metadata
        if: runner.os == 'Linux'
        run: node scripts/verify-update-metadata.mjs linux 0.1.0 release
      - name: Verify Windows updater metadata
        if: runner.os == 'Windows'
        run: node scripts/verify-update-metadata.mjs windows 0.1.0 release
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: node scripts/verify-release-artifacts.mjs linux 0.1.0 release
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        run: node scripts/verify-release-artifacts.mjs windows 0.1.0 release
      - name: Native preload and IPC smoke (Linux)
        if: runner.os == 'Linux'
        env:
          SPINDLE_SMOKE_TEST: '1'
        run: xvfb-run -a timeout 45s pnpm exec electron . --no-sandbox
      - name: Install and smoke-test the generated Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          SPINDLE_SMOKE_TEST: '1'
          SPINDLE_SMOKE_INSTALLED_DEB: '1'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          package="release/Spindle-${version}-linux-x64.deb"
          test -f "$package"
          # Install the actual .deb on this ephemeral hosted runner, including
          # its declared runtime dependencies. No mock dpkg/pkexec is involved.
          sudo apt-get install --yes "./$package"
          installed="$(dpkg-query --show --showformat='${Version}' spindle)"
          if [[ "$installed" != "$version" ]]; then
            echo "::error::Installed Debian version does not match package metadata"
            exit 1
          fi
          binary="$(readlink -f "$(command -v spindle)")"
          test -x "$binary"
          xvfb-run -a timeout 45s "$binary" --no-sandbox

  deb-upgrade:
    name: Native Debian upgrade / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build an older RC Debian installer (not published)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9000
          pnpm build
          pnpm exec electron-builder --linux deb --x64 --publish never
          cp release/Spindle-0.1.0-rc.9000-linux-x64.deb "$RUNNER_TEMP/"
      - name: Install older RC and verify running package
        shell: bash
        env:
          SPINDLE_SMOKE_TEST: '1'
          SPINDLE_SMOKE_INSTALLED_DEB: '1'
        run: |
          set -euo pipefail
          sudo apt-get install --yes "$RUNNER_TEMP/Spindle-0.1.0-rc.9000-linux-x64.deb"
          xvfb-run -a timeout 45s /opt/Spindle/spindle --no-sandbox
      - name: Build a newer RC Debian installer (not published)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9001
          pnpm build
          pnpm exec electron-builder --linux deb --x64 --publish never
          test -f release/Spindle-0.1.0-rc.9001-linux-x64.deb
      - name: Test denied elevation and real verified Debian upgrade
        env:
          SPINDLE_NATIVE_DEB_UPGRADE: '1'
        run: pnpm exec tsx tests/helpers/native-deb-upgrade.ts
      - name: Verify upgraded application and updater preflight
        shell: bash
        env:
          SPINDLE_SMOKE_TEST: '1'
          SPINDLE_SMOKE_INSTALLED_DEB: '1'
        run: |
          set -euo pipefail
          installed="$(dpkg-query --show --showformat='${Version}' spindle)"
          test "$installed" = '0.1.0~rc.9001'
          xvfb-run -a timeout 45s /opt/Spindle/spindle --no-sandbox
