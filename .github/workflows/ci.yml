name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bootstrap exception: pnpm-lock.yaml will be committed after the first
      # dependency resolution; switch to --frozen-lockfile once generated.
      - name: Install
        run: pnpm install --no-frozen-lockfile
      # Temporary one-run bootstrap output; removed after committing the lockfile.
      - name: Export generated pnpm lockfile
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo '__SPINDLE_LOCKFILE_BEGIN__'
          base64 -w0 pnpm-lock.yaml
          echo
          echo '__SPINDLE_LOCKFILE_END__'
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Package smoke test
        run: pnpm exec electron-builder --dir --publish never
