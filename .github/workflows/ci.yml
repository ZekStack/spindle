name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        if: runner.os == 'Linux'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      # Release stamps package.json from the tag before running tests.
      # Exercise that path on PRs, then restore the source version for packaging.
      - name: Validate RC tests against a stamped release version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/spindle-package.json"
          trap 'cp "$RUNNER_TEMP/spindle-package.json" package.json' EXIT
          node scripts/prepare-release.mjs --prepare v0.1.1
          pnpm exec tsx --test tests/release-rc.test.ts
      - name: Build
        run: pnpm build
      - name: Package Linux (.deb and AppImage)
        if: runner.os == 'Linux'
        run: bash ./scripts/retry-electron-builder.sh --linux AppImage deb --x64 --publish never
      - name: Package Windows (.exe)
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Verify Linux updater metadata
        if: runner.os == 'Linux'
        run: node scripts/verify-update-metadata.mjs linux 0.1.0 release
      - name: Verify Windows updater metadata
        if: runner.os == 'Windows'
        run: node scripts/verify-update-metadata.mjs windows 0.1.0 release
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: node scripts/verify-release-artifacts.mjs linux 0.1.0 release
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        run: node scripts/verify-release-artifacts.mjs windows 0.1.0 release
      - name: Native preload and IPC smoke (Linux)
        if: runner.os == 'Linux'
        env:
          SPINDLE_SMOKE_TEST: '1'
        run: xvfb-run -a timeout 45s pnpm exec electron . --no-sandbox
      - name: Install and smoke-test generated Linux DEB and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-release-linux.sh "$(node -p "require('./package.json').version")"

  deb-upgrade:
    name: Native Debian upgrade / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build an older RC Debian installer (not published)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9000
          pnpm build
          bash ./scripts/retry-electron-builder.sh --linux deb --x64 --publish never
          cp release/Spindle-0.1.0-rc.9000-linux-x64.deb "$RUNNER_TEMP/"
      - name: Install older RC and verify running package
        shell: bash
        env:
          SPINDLE_SMOKE_TEST: '1'
          SPINDLE_SMOKE_INSTALLED_DEB: '1'
        run: |
          set -euo pipefail
          sudo apt-get install --yes "$RUNNER_TEMP/Spindle-0.1.0-rc.9000-linux-x64.deb"
          xvfb-run -a timeout 45s /opt/Spindle/spindle --no-sandbox
      - name: Build a newer RC Debian installer (not published)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9001
          pnpm build
          bash ./scripts/retry-electron-builder.sh --linux deb --x64 --publish never
          test -f release/Spindle-0.1.0-rc.9001-linux-x64.deb
      - name: Test denied elevation and real verified Debian upgrade
        env:
          SPINDLE_NATIVE_DEB_UPGRADE: '1'
        run: pnpm exec tsx tests/helpers/native-deb-upgrade.ts
      - name: Verify upgraded application and updater preflight
        shell: bash
        env:
          SPINDLE_SMOKE_TEST: '1'
          SPINDLE_SMOKE_INSTALLED_DEB: '1'
        run: |
          set -euo pipefail
          installed="$(dpkg-query --show --showformat='${Version}' spindle)"
          test "$installed" = '0.1.0~rc.9001'
          xvfb-run -a timeout 45s /opt/Spindle/spindle --no-sandbox

  nsis-upgrade:
    name: Native NSIS upgrade / windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build an older RC NSIS installer (not published)
        shell: pwsh
        run: |
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build a newer RC NSIS installer (not published)
        shell: pwsh
        run: |
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9001
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real silent NSIS install and upgrade
        shell: pwsh
        run: ./scripts/test-nsis-upgrade.ps1
      - name: Validate tagged NSIS release smoke using unpublished CI fixture
        shell: pwsh
        env:
          SPINDLE_RELEASE_SMOKE: '1'
        run: ./scripts/smoke-release-nsis.ps1 -Version 0.1.0-rc.9001

  appimage-upgrade:
    name: Native AppImage replacement / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the older unpublished AppImage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9000
          pnpm build
          bash ./scripts/retry-electron-builder.sh --linux AppImage --x64 --publish never
          mkdir -p "$RUNNER_TEMP/spindle-appimage-integration"
          cp release/Spindle-0.1.0-rc.9000-linux-x64.AppImage "$RUNNER_TEMP/spindle-appimage-integration/"
      - name: Build the newer unpublished AppImage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.9001
          pnpm build
          bash ./scripts/retry-electron-builder.sh --linux AppImage --x64 --publish never
          test -f release/Spindle-0.1.0-rc.9001-linux-x64.AppImage
      - name: Verify real AppImage runtime and portable version replacement
        shell: bash
        env:
          SPINDLE_NATIVE_APPIMAGE_UPGRADE: '1'
        run: bash ./scripts/test-appimage-upgrade.sh

  live-deb-download:
    name: Live GitHub DEB update download / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build an unpublished older RC Debian package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --prepare v0.1.0-rc.0
          pnpm build
          bash ./scripts/retry-electron-builder.sh --linux deb --x64 --publish never
          test -f release/Spindle-0.1.0-rc.0-linux-x64.deb
      - name: Install and exercise real public GitHub DEB update check and download
        shell: bash
        env:
          SPINDLE_SMOKE_TEST: '1'
          SPINDLE_SMOKE_INSTALLED_DEB: '1'
          SPINDLE_SMOKE_LIVE_DEB_UPDATE: '1'
        run: |
          set -euo pipefail
          sudo apt-get install --yes ./release/Spindle-0.1.0-rc.0-linux-x64.deb
          export SPINDLE_SMOKE_RESULT_FILE="$RUNNER_TEMP/spindle-live-deb.json"
          # Anonymous public release access: do not supply a GitHub token to
          # the application process; we want to exercise the public feed.
          unset GH_TOKEN GITHUB_TOKEN
          xvfb-run -a timeout 360s /opt/Spindle/spindle --no-sandbox
          node - "$SPINDLE_SMOKE_RESULT_FILE" <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          assert.equal(result.version, '0.1.0-rc.0')
          assert.equal(result.installType, 'deb')
          assert.equal(result.phase, 'idle')
          assert.equal(result.liveDownload.phase, 'ready')
          assert.equal(result.liveDownload.percent, 100)
          assert.match(result.liveDownload.version, /^\d+\.\d+\.\d+(?:-rc\.\d+)?$/)
          console.log('Verified live GitHub DEB download: ' +
            result.version + ' -> ' + result.liveDownload.version)
          NODE
          # This job deliberately stops before calling pkexec or modifying
          # the OS package. Real Mint install/restart QA remains mandatory.
          test "$(dpkg-query --show --showformat='${Version}' spindle)" = '0.1.0~rc.0'
